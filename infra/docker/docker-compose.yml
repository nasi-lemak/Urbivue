services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: urbivue
      POSTGRES_USER: urbivue
      POSTGRES_PASSWORD: urbivue
    ports:
      - '5432:5432'
    volumes:
      - dbdata:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U urbivue -d urbivue']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  dbdata:
