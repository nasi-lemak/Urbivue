# Production broker config: authenticated, with per-device topic isolation.
# Generate /mosquitto/config/passwd and /mosquitto/config/acl with:
#   pnpm --filter @urbivue/api export-mqtt-auth <outDir> <apiPassword>
# and re-run it after issuing/rotating/revoking device keys (then restart or
# SIGHUP mosquitto).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
