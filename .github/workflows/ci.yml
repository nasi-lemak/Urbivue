name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: urbivue
          POSTGRES_USER: urbivue
          POSTGRES_PASSWORD: urbivue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbivue -d urbivue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://urbivue:urbivue@localhost:5432/urbivue
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Firmware core tests (Rust)
        run: cargo test --manifest-path firmware/rust/Cargo.toml

      - name: Database migrations + seed (against live PostGIS/Timescale)
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: API smoke test (live HTTP against the seeded database)
        env:
          DISABLE_MQTT: 'true'
          JWT_SECRET: ci-smoke-secret
        run: |
          (cd apps/api && node -r @swc-node/register src/main.ts &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          node scripts/smoke.mjs
