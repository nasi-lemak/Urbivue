name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: urbivue
          POSTGRES_USER: urbivue
          POSTGRES_PASSWORD: urbivue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urbivue -d urbivue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://urbivue:urbivue@localhost:5432/urbivue
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database migrations + seed (against live PostGIS/Timescale)
        run: |
          pnpm db:migrate
          pnpm db:seed
